<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Jack</title>
    <link rel="stylesheet" href="black.css">
</head>

<body>
    <div id="stars-bg" class="stars-bg"></div>

    <div class="moon">
       <img class="moon-svg" src="SVG-cards-1.3/moon1319.png" alt="moon">
    </div>
    <div class="sun">
        <img class="sun-svg" src="SVG-cards-1.3/sun59569.png" alt="sun">
    </div>
    <section id="table" class="table">
        <div class="border">
            <div class="flex-area">
                <div id="dealer-area" class="dealer-area">
                </div>
                <div class="center">
                    <h1 id="title">Black Jack</h1>
                </div>
                <div id="player-area" class="player-area">
                </div>
            </div>
        </div>
        <!-- this is to flip my cards -->
        <div class="scene">
            <div class="card">
                <div class="card_face"></div>
                <!-- <div class="card_back my-design"></div> -->
            </div>
        </div>
    </section>
    <!-- flip my card ends-->
    <div>
    </div>
    <!-- div-2 -->
    <div class="btn-container">
        <div class="dealer">
            <div class="player">
                <div>
                </div>
                <div class="player-btn">
                    <div class="dealer-btn">
                    </div>
                    <button id="deal" class="btn" type="button">DEAL</button>
                    <button id="hit" class="btn2" type="button">HIT</button>
                    <button id="stay" class="btn2" type="button">STAY</button>
                    <a href="front.html">
                        <button id="stay" class="btn2" type="button">NEW GAME</button>
                    </a>
                </div>
            </div>
            <div>

            </div>
        </div>
    </div>
    <script src="blackjack.js"></script>

</html>
